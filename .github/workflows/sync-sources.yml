name: Sincronizza fonti istituzionali

on:
  push:
    paths-ignore:
      - "data/sources.json"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sincronizza
        run: python scripts/sync_sources.py
      - name: Commit aggiornamenti
        run: |
          git config user.name "Verifica Politica Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna fonti istituzionali"
          git push
