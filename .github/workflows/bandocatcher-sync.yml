name: BandoCatcher — sync opportunità

on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-bandocatcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandocatcher
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync TED + Funding & Tenders
        run: python ingestion/sync.py
      - name: Commit dataset
        working-directory: .
        run: |
          git config user.name "BandoCatcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bandocatcher/data/opportunities.js bandocatcher/data/sync-status.json
          git diff --cached --quiet && exit 0
          git commit -m "BandoCatcher: aggiorna opportunità"
          git push
